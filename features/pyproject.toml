# The feature contract: the single implementation of windowing and feature
# computation, imported at training time (data-pipeline) and serving time
# (anomaly-svc). numpy-only, no I/O — a feature that needs a dataframe or a
# file handle isn't a feature yet (ADR-0003). Any change here bumps
# features.__version__ and invalidates every model artefact, on purpose.
[project]
name = "features"
version = "0.1.0"
description = "Shared windowing + feature computation for twin-anomaly: the training/serving skew tripwire."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/features"]
