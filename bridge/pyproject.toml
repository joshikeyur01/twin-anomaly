# L2 plumbing, vendored from twin-hello and extended with the command path.
# Not a service: no Dockerfile, runs on the host next to ROS 2 (rclpy and the
# ROS message packages come from the sourced ROS environment, never from pip).
[project]
name = "bridge"
version = "0.1.0"
description = "DDS<->MQTT bridge: /joint_states out to MQTT, twin/<asset>/cmd/joints back to ROS 2."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "contracts",
    "aiomqtt>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]
