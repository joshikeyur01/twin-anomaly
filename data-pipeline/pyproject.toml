# The streaming->ML boundary. Batch CLI, run-to-completion — never a
# daemon, never a trainer, never a server (AGENTS.md). The only member
# allowed to depend on pyarrow and the Influx client's read side; windows
# and features come from the shared features/ package so training-time
# computation is byte-for-byte the serving-time computation (ADR-0003).
[project]
name = "data-pipeline"
version = "0.1.0"
description = "Batches InfluxDB telemetry into labelled parquet windows for twin-anomaly model training."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "contracts",
    "features",
    "influxdb-client>=1.45",
    "pyarrow>=17.0",
    "structlog>=24.1",
]

[tool.uv.sources]
contracts = { workspace = true }
features = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_pipeline"]
