# The single source of truth for every cross-service payload shape.
# Versioned with the repo; every schema change needs a CHANGELOG entry
# and regenerated stubs in the same commit (ADR-0003).
[project]
name = "contracts"
version = "0.1.0"
description = "Shared contracts for twin-services: Pydantic models (MQTT/REST) + protobuf stubs (gRPC)."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "grpcio>=1.66",     # runtime for generated gRPC stubs
    "protobuf>=5.28",   # runtime for generated *_pb2 modules
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
