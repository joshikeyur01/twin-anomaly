# The first L4 service that consumes the twin instead of constituting it.
# Depends on features/ and detector/ (the serving half of the skew tripwire)
# and the model runtime — never on pyarrow, pandas, or the Influx client
# (STYLE.md). torch joins via detector only if the LSTM-AE survives Phase 3.
[project]
name = "anomaly-svc"
version = "0.1.0"
description = "Scores live telemetry against a pinned model artefact; POST /score for offline windows."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "contracts",
    "features",
    "detector",
    "numpy>=2.0",
    "aiomqtt>=2.3",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
contracts = { workspace = true }
features = { workspace = true }
detector = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anomaly_svc"]
