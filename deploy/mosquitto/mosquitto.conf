# Mosquitto 2.x requires an explicit listener + auth stance (defaults changed
# from 1.x: no listener means localhost-only inside the container, useless
# behind Docker networking).
#
# Anonymous access is a deliberate dev-only choice, scoped to the compose
# network / localhost. mTLS is twin-fleet's problem (see ARCHITECTURE.md,
# "What this repo intentionally omits").

listener 1883
allow_anonymous true

persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
