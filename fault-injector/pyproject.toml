# The ground-truth generator. Not a service: no Dockerfile, runs on the host
# next to ROS 2 (rclpy comes from the sourced ROS environment, never pip),
# sitting in the sensor path /joint_states_raw -> /joint_states. Faults are
# pure transforms on that stream; labels leave over MQTT out-of-band from
# the telemetry they corrupt (ADR-0002).
[project]
name = "fault-injector"
version = "0.1.0"
description = "Passthrough ROS 2 node that applies parameterised faults to the UR5 sensor stream and emits ground-truth labels."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "contracts",
    "aiomqtt>=2.3",
    "structlog>=24.1",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fault_injector"]
